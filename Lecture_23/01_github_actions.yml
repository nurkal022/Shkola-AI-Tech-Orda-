# ============================================================
# Лекция 23: CI/CD пайплайн с GitHub Actions
# ============================================================
#
# Этот файл — ПРИМЕР GitHub Actions workflow.
# В реальном проекте он лежит в: .github/workflows/deploy.yml
#
# Что делает:
#   1. При push в main → запускает тесты
#   2. Собирает Docker-образ
#   3. Деплоит на Railway / Render
# ============================================================

name: CI/CD Pipeline

# Когда запускать?
on:
  push:
    branches: [main]          # При push в main
  pull_request:
    branches: [main]          # При PR в main

# Переменные окружения
env:
  DOCKER_IMAGE: ai-chat-api
  PYTHON_VERSION: "3.12"

jobs:
  # ─────────────────────────────────────────
  # Job 1: Тесты
  # ─────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Устанавливаем Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Шаг 3: Устанавливаем зависимости
      - name: Install dependencies
        run: |
          cd Lecture_23
          pip install -r app/requirements.txt
          pip install pytest httpx

      # Шаг 4: Проверяем синтаксис
      - name: Syntax check
        run: python -m py_compile Lecture_23/app/main.py

      # Шаг 5: Запускаем тесты
      - name: Run tests
        run: |
          cd Lecture_23
          python -m pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ─────────────────────────────────────────
  # Job 2: Сборка Docker-образа
  # ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test                 # Запускается ПОСЛЕ тестов
    if: github.ref == 'refs/heads/main'  # Только для main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Собираем образ
      - name: Build Docker image
        run: |
          cd Lecture_23
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .

      # Проверяем что образ запускается
      - name: Test Docker image
        run: |
          docker run -d --name test-container \
            -p 8000:8000 \
            -e OPENAI_API_KEY=sk-test \
            ${{ env.DOCKER_IMAGE }}:latest
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop test-container

      # (Опционально) Push в GitHub Container Registry
      # - name: Push to GHCR
      #   run: |
      #     echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #     docker tag ${{ env.DOCKER_IMAGE }}:latest ghcr.io/${{ github.repository }}:latest
      #     docker push ghcr.io/${{ github.repository }}:latest

  # ─────────────────────────────────────────
  # Job 3: Деплой на Railway
  # ─────────────────────────────────────────
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ai-chat-api

  # ─────────────────────────────────────────
  # (Альтернатива) Job 3: Деплой на Render
