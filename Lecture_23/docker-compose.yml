# ============================================================
# Лекция 23: Docker Compose
# ============================================================
#
# Запуск:  docker compose up
# Фон:    docker compose up -d
# Стоп:   docker compose down
# Логи:   docker compose logs -f
# ============================================================

services:
  # ─────────────────────────────────────────
  # AI Chat API
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}   # Из .env или shell
      - PORT=8000
      - DEFAULT_MODEL=gpt-4o-mini
      - LOG_LEVEL=INFO
    # env_file:
    #   - .env   # Альтернатива: все переменные из файла
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────
  # (Опционально) Nginx reverse proxy
